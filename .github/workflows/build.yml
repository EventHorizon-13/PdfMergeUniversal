name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  QPDF_VERSION: '12.4.2'

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Download portable QPDF
        run: |
          archive="qpdf-${QPDF_VERSION}-mingw32.zip"
          curl --fail --location --retry 3 \
            "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/${archive}" \
            -o /tmp/qpdf.zip
          mkdir -p /tmp/qpdf dist/qpdf
          unzip -q /tmp/qpdf.zip -d /tmp/qpdf
          qpdf_exe="$(find /tmp/qpdf -type f -path '*/bin/qpdf.exe' -print -quit)"
          if [ -z "$qpdf_exe" ]; then
            echo "::error::qpdf.exe was not found in the official archive"
            exit 1
          fi
          qpdf_root="${qpdf_exe%/bin/qpdf.exe}"
          cp -a "$qpdf_root"/. dist/qpdf/
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/qpdf/qpdf/v${QPDF_VERSION}/LICENSE.txt" \
            -o dist/qpdf/LICENSE.txt

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui -s -w" -o dist/PdfMergeUniversal.exe .
          cp PdfMergeUniversal.ico README.md LICENSE dist/
          cd dist
          zip -9 -r PdfMergeUniversal_Windows.zip PdfMergeUniversal.exe PdfMergeUniversal.ico README.md LICENSE qpdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfMergeUniversal-Windows
          path: dist/PdfMergeUniversal_Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PdfMergeUniversal_Windows.zip
          generate_release_notes: true
