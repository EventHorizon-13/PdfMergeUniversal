name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui -s -w" -o dist/PdfMergeUniversal.exe .
          cp PdfMergeUniversal.ico README.md LICENSE dist/
          cd dist
          zip -9 PdfMergeUniversal_Windows.zip PdfMergeUniversal.exe PdfMergeUniversal.ico README.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfMergeUniversal-Windows
          path: dist/PdfMergeUniversal_Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PdfMergeUniversal_Windows.zip
          generate_release_notes: true
