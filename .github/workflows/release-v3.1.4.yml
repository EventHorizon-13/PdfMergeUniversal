name: Release v3.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.1.4.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui -s -w" -o dist/PdfMergeUniversal.exe .
          cp PdfMergeUniversal.ico README.md LICENSE dist/
          cd dist
          zip -9 PdfMergeUniversal_Windows.zip PdfMergeUniversal.exe PdfMergeUniversal.ico README.md LICENSE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.4
          target_commitish: main
          name: PdfMergeUniversal v3.1.4
          generate_release_notes: true
          files: dist/PdfMergeUniversal_Windows.zip
